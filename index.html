<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator with Unit Conversion</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Calculator</h1>

        <!-- Calculator -->
        <div class="calculator-display-container">
            <div class="history-log" id="history-log"></div>
            <div class="display">
                <div class="unit-display" id="unit-display"></div>
                <div class="datetime-display" id="datetime-display"></div>
                <input type="text" id="display" readonly value="0">
            </div>
        </div>

        <!-- DateTime Input -->
        <div class="datetime-input-section">
            <input type="datetime-local" id="datetime-input" placeholder="Select date/time">
            <button onclick="useDatetime()" class="btn-datetime">Use DateTime</button>
            <button onclick="useNow()" class="btn-now">Now</button>
        </div>

        <div class="buttons">
            <button onclick="clearDisplay()" class="btn-operator">C</button>
            <button onclick="deleteLast()" class="btn-operator">⌫</button>
            <button onclick="appendOperator('/')" class="btn-operator">/</button>
            <button onclick="appendOperator('*')" class="btn-operator">×</button>

            <button onclick="appendNumber('7')" class="btn-number">7</button>
            <button onclick="appendNumber('8')" class="btn-number">8</button>
            <button onclick="appendNumber('9')" class="btn-number">9</button>
            <button onclick="appendOperator('-')" class="btn-operator">-</button>

            <button onclick="appendNumber('4')" class="btn-number">4</button>
            <button onclick="appendNumber('5')" class="btn-number">5</button>
            <button onclick="appendNumber('6')" class="btn-number">6</button>
            <button onclick="appendOperator('+')" class="btn-operator">+</button>

            <button onclick="appendNumber('1')" class="btn-number">1</button>
            <button onclick="appendNumber('2')" class="btn-number">2</button>
            <button onclick="appendNumber('3')" class="btn-number">3</button>
            <button onclick="calculate()" class="btn-equals" style="grid-row: span 2">=</button>

            <button onclick="appendNumber('0')" class="btn-number" style="grid-column: span 2">0</button>
            <button onclick="appendNumber('.')" class="btn-number">.</button>
        </div>

        <!-- Unit Conversion Row -->
        <div class="unit-buttons">
            <button onclick="showUnitMenu()" class="btn-unit-menu">🕐 Units</button>
        </div>

        <!-- Unit Selection Menu (hidden by default) -->
        <div id="unit-menu" class="unit-menu">
            <button onclick="selectUnit('seconds')" class="btn-unit">sec</button>
            <button onclick="selectUnit('minutes')" class="btn-unit">min</button>
            <button onclick="selectUnit('hours')" class="btn-unit">hr</button>
            <button onclick="selectUnit('days')" class="btn-unit">day</button>
            <button onclick="selectUnit('weeks')" class="btn-unit">wk</button>
            <button onclick="selectUnit('months')" class="btn-unit">mo</button>
            <button onclick="selectUnit('years')" class="btn-unit">yr</button>
        </div>
    </div>

    <script src="calculator.js"></script>
</body>
</html>
