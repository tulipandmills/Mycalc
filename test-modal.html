<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Test</title>
    <style>
        .modal {
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .modal.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
        }

        .btn-unit-menu {
            padding: 12px 30px;
            font-size: 16px;
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Modal Test Page</h1>
    <button onclick="showUnitMenu()" class="btn-unit-menu">🕐 Open Modal</button>

    <div id="unit-modal" class="modal">
        <div class="modal-content">
            <h3>Modal Content</h3>
            <p>This is a test modal</p>
            <button onclick="closeUnitMenu()">Close</button>
        </div>
    </div>

    <div id="status" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc;">
        <h3>Status:</h3>
        <div id="log"></div>
    </div>

    <script>
        function showUnitMenu() {
            const modal = document.getElementById('unit-modal');
            const log = document.getElementById('log');
            if (modal) {
                modal.classList.add('show');
                log.innerHTML += `<div>✓ Modal opened, classes: ${modal.className}</div>`;
                console.log('Modal opened, classes:', modal.className);
            } else {
                log.innerHTML += '<div>✗ Modal element not found!</div>';
                console.error('Modal element not found!');
            }
        }

        function closeUnitMenu() {
            const modal = document.getElementById('unit-modal');
            const log = document.getElementById('log');
            if (modal) {
                modal.classList.remove('show');
                log.innerHTML += `<div>✓ Modal closed, classes: ${modal.className}</div>`;
                console.log('Modal closed');
            }
        }

        // Click outside to close
        document.addEventListener('click', (e) => {
            const modal = document.getElementById('unit-modal');
            if (e.target === modal) {
                closeUnitMenu();
            }
        });

        // Test on load
        window.onload = function() {
            const log = document.getElementById('log');
            log.innerHTML += '<div>✓ Page loaded successfully</div>';
            log.innerHTML += `<div>✓ Modal element exists: ${document.getElementById('unit-modal') !== null}</div>`;
        };
    </script>
</body>
</html>
